name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  check_title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # release-please parses the merged commit message to decide whether
          # to trigger a release, so the PR title (used as the squash/merge
          # commit message) must follow Conventional Commits, e.g. "fix: ..."
          # or "feat: ...". See release-please-config.json for the full list
          # of recognized types.
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
